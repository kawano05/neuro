<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}（ご家族・先生・支援者の方へ）</title>
<!--
  {{GENERATED_NOTE}}
  印刷して渡すための説明書（A4 で2〜3枚）。打ち合わせで「お母さんに渡す簡単な
  説明書がほしい」「最初の画面だけでも、どのボタンが何をするのか支援者向けに
  書いてあれば解決しそう」と言われた（docs/design-renewal-2026-09-25.md §1.8）。
  アプリの中の「はじめての方へ：つかいかた」（設定画面）と同じ中身を、絵つきで。
  オフラインでも読めるよう、字体・絵はすべてこのファイルの中に持つ。
-->
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #4e5d78;
    --line: #1a1a1a;
    --blue: #005aff;
    --yellow: #ffc83d;
    --paper: #ffffff;
    --soft: #f2f7ff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #e9eef5;
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.75;
  }

  .sheet {
    width: min(210mm, 100%);
    margin: 16px auto;
    padding: 14mm 14mm 12mm;
    background: var(--paper);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px auto 0;
  }

  .toolbar button {
    min-height: 44px;
    padding: 0 22px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--blue);
    color: #ffffff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    line-height: 1.4;
  }

  .lead {
    margin: 0 0 14px;
    color: var(--muted);
  }

  h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 3px solid var(--line);
    font-size: 18px;
  }

  h2 .num {
    display: inline-grid;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--ink);
    color: #ffffff;
    place-items: center;
    font-size: 15px;
  }

  section {
    break-inside: avoid;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .step {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 8px;
    padding: 10px 12px 12px;
    border: 2px solid var(--line);
    border-radius: 14px;
    break-inside: avoid;
  }

  .step strong {
    font-size: 16px;
  }

  .step p {
    margin: 0;
  }

  /* 画面の見本（アプリの画面を簡単にした絵） */
  .screen {
    position: relative;
    height: 120px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: #0b1a33;
    overflow: hidden;
  }

  .screen.light {
    background: #ffffff;
  }

  .screen .big-button {
    position: absolute;
    inset: 32px 22%;
    display: grid;
    border: 3px solid var(--line);
    border-radius: 999px;
    background: var(--blue);
    color: #ffffff;
    place-items: center;
    font-size: 18px;
    font-weight: 800;
  }

  .screen .tiles {
    position: absolute;
    inset: 22px 10px 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 5px;
  }

  .screen .tiles span {
    display: flex;
    align-items: flex-start;
    padding: 2px 4px;
    border: 2px solid var(--line);
    border-radius: 6px;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.2;
  }

  .screen .tiles span:first-child {
    grid-column: 1 / span 2;
    grid-row: 1 / span 2;
    outline: 3px solid var(--yellow);
    outline-offset: 1px;
  }

  .screen .corner {
    position: absolute;
    top: 3px;
    right: 8px;
    padding: 0 6px;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    background: #ffffff;
    font-size: 9px;
    font-weight: 700;
    line-height: 1.5;
  }

  .screen .bar {
    position: absolute;
    top: 6px;
    right: 8px;
    display: flex;
    gap: 5px;
  }

  .screen .bar span {
    padding: 1px 6px;
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: 6px;
    background: rgba(0, 8, 20, 0.8);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
  }

  .screen .animal {
    position: absolute;
    left: 50%;
    top: 58%;
    width: 110px;
    transform: translate(-50%, -50%);
  }

  .screen .buttons {
    position: absolute;
    inset: auto 12px 18px;
    display: flex;
    gap: 8px;
  }

  .screen .buttons span {
    flex: 1;
    padding: 6px 0;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: #ffffff;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
  }

  .screen .buttons span:first-child {
    background: var(--blue);
    color: #ffffff;
    outline: 3px solid var(--yellow);
  }

  .screen .done {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    padding: 6px 8px;
    border: 1.5px solid var(--line);
    text-align: left;
    vertical-align: top;
  }

  th {
    background: var(--soft);
  }

  td.no {
    width: 36px;
    font-weight: 800;
    text-align: center;
  }

  .badge {
    display: inline-block;
    padding: 0 8px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .note {
    margin: 8px 0 0;
    padding: 8px 12px;
    border-left: 6px solid var(--yellow);
    background: #fff8e0;
  }

  .qa {
    margin: 0;
  }

  .qa dt {
    margin-top: 8px;
    font-weight: 800;
  }

  .qa dt::before {
    content: "Q. ";
    color: var(--blue);
  }

  .qa dd {
    margin: 0 0 0 1.4em;
  }

  section ul {
    margin: 4px 0 8px;
    padding-left: 1.4em;
  }

  section p {
    margin: 6px 0;
  }

  .foot {
    margin-top: 16px;
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 640px) {
    .sheet {
      margin: 0;
      padding: 16px;
      box-shadow: none;
    }

    .steps {
      grid-template-columns: 1fr;
    }
  }

  @page {
    size: A4;
    margin: 12mm;
  }

  @media print {
    body {
      background: #ffffff;
      font-size: 10.5pt;
    }

    .sheet {
      width: auto;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }

    .toolbar {
      display: none;
    }

    .page-break {
      break-before: page;
    }

    .screen,
    h2 .num,
    .screen .big-button,
    .screen .bar span,
    .screen .buttons span:first-child,
    th,
    .note {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" onclick="window.print()">印刷する（A4）</button>
</div>

<main class="sheet">
  <h1>{{TITLE}}</h1>
  <p class="lead">
    {{LEAD}}
  </p>

  {{BODY}}

  <p class="foot">この説明書は、アプリの設定画面の「はじめての方へ：つかいかた」と同じ中身です。</p>
</main>
</body>
</html>
