name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  # プレビューのブランチへの push でも、そちらの preview-pages.yml がここを
  # 起動する（公開は main からしか許していないため、組み立てはここで行う）。
  workflow_dispatch:
    inputs:
      preview_branch:
        description: "/preview/ に同居させるブランチ"
        required: false
        default: design/hakkiri

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 本番（main）と同じサイトの /preview/ に出す、デザイン改修中のブランチ。
  # ブランチが無くなれば、本番だけを出す（下の Preview の段）。
  PREVIEW_BRANCH: ${{ github.event.inputs.preview_branch || 'design/hakkiri' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # ブラウザ検査（5実寸・実測45分）は ci.yml が回している。ここで同じ
      # `npm test` を丸ごと繰り返すと、毎push 45分のジョブが2本走るうえ、
      # 詰まる面が倍になる（実際 Pages 側が Playwright の導入で2時間40分
      # 張り付いた）。
      #
      # とはいえ門を外すと、壊れたビルドがそのまま公開される。単体テストは
      # 数秒で終わり、CSVの列・辞書の抜け・判定ロジックといった「壊れても
      # 画面では気づけない」ものを見ているので、公開の門はこちらに任せる。
      - name: Run unit tests
        run: npm run test:unit

      # dist を作る。これまでは npm test の中の test:web が build していたので、
      # そこを外したぶんを明示する（外し忘れると空の dist を公開する）。
      - name: Build web app
        run: npm run build

      # --- Preview: デザイン改修中のブランチを /preview/ に同居させる -----
      #
      # https://kawano05.github.io/neuro/preview/ 。GitHub Pages は1リポジトリに
      # 1サイトなので、本番の dist の下に置く。
      #
      # 本番の公開は、プレビューの成否に左右させない。プレビューのビルドや
      # テストが落ちたら、プレビューを出さずに本番だけを出す。
      #
      # 置くのは本番の Service Worker を作ったあと（npm run build の中の
      # generate-sw）。先に置くと、本番の SW がプレビューのファイルまで
      # 事前キャッシュする。プレビューは自分の SW を /preview/ の範囲で持つ。
      #
      # VITE_PREVIEW=1 はプレビューの保存キーを分ける（src/lib/content.js）。
      # 本番とプレビューは同じオリジンに載るので、分けないと記録が混ざる。
      - name: Check preview branch
        id: preview
        run: |
          if git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview branch $PREVIEW_BRANCH not found; publishing main only."
          fi

      - name: Checkout preview branch
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview-src

      - name: Build preview
        id: preview_build
        if: steps.preview.outputs.exists == 'true'
        continue-on-error: true
        working-directory: preview-src
        env:
          VITE_PREVIEW: "1"
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Place preview under /preview/
        if: steps.preview_build.outcome == 'success'
        run: cp -r preview-src/dist dist/preview

      - name: Report a skipped preview
        if: steps.preview.outputs.exists == 'true' && steps.preview_build.outcome != 'success'
        run: echo "::warning::Preview build of $PREVIEW_BRANCH failed; publishing main only."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
