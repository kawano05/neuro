name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # ブラウザ検査（5実寸・実測45分）は ci.yml が回している。ここで同じ
      # `npm test` を丸ごと繰り返すと、毎push 45分のジョブが2本走るうえ、
      # 詰まる面が倍になる（実際 Pages 側が Playwright の導入で2時間40分
      # 張り付いた）。
      #
      # とはいえ門を外すと、壊れたビルドがそのまま公開される。単体テストは
      # 数秒で終わり、CSVの列・辞書の抜け・判定ロジックといった「壊れても
      # 画面では気づけない」ものを見ているので、公開の門はこちらに任せる。
      - name: Run unit tests
        run: npm run test:unit

      # dist を作る。これまでは npm test の中の test:web が build していたので、
      # そこを外したぶんを明示する（外し忘れると空の dist を公開する）。
      - name: Build web app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
