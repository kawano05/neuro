name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web build and browser tests
    runs-on: ubuntu-latest
    # 上限を置く。既定は6時間で、詰まったステップがそのまま走り続ける
    # （実際に Pages 側が「Install Playwright browser」で2時間40分張り付いた）。
    # ブラウザ検査は5実寸ぶんで実測45分なので、その倍を上限にする。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Run unit and browser tests
        run: npm test

      # 実機（iPad + NeuroNode）が手元に無い期間は、見た目の確認が CI しか
      # できない。ビルドとテストが緑でも「画面がどう見えるか」は分からず、
      # 余白の破綻・文字の折り返し・暗すぎる対象物はどれもテストを通り抜ける。
      # push のたびに3つの実寸（iPad縦・スマホ縦・スマホ横）を残しておく。
      #
      # 判定は tests/ の仕事なので、撮影に失敗しても CI は落とさない。
      - name: Capture screenshots
        if: always()
        continue-on-error: true
        run: node scripts/capture-screens.mjs artifacts/screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 14

  capacitor-ios:
    name: Capacitor iOS build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Generate iOS project
        run: npm run cap:add:ios

      - name: Sync Capacitor assets
        run: npx cap sync ios

      - name: Inspect generated iOS project
        run: ls -la ios/App

      - name: Build iOS simulator target
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      # ここまでは .app を作るだけで、WKWebView は一度も動いていない。
      # 実機は無いが、シミュレータなら**本物の iOS WebKit**を動かせる。
      # ルビ（ふりがな）の組み方は engine 差が出る場所で、手元の Playwright の
      # WebKit と Chromium でも行の高さが 61px と 53px に割れた——iOS で
      # どうなるかは、iOS で描かせないと分からない。
      #
      # 手元（Windows）で検証できないので continue-on-error。落ちても他の
      # ジョブを止めない。得たいのは合否ではなく**成果物のスクリーンショット**。
      - name: Render the ruby probe on a real iOS simulator
        continue-on-error: true
        # 詰まっても待ち続けない。continue-on-error は「失敗しても止めない」で
        # あって「ハングしても止めない」ではないので、時間の上限は別に要る。
        timeout-minutes: 12
        run: |
          set -x
          # 起動済みのシミュレータを1台用意する。
          UDID=$(xcrun simctl list devices available -j             | python3 -c "import json,sys; d=json.load(sys.stdin)['devices'];                 ds=[x for v in d.values() for x in v if x.get('isAvailable')];                 ipad=[x for x in ds if 'iPad' in x['name']];                 print((ipad or ds)[0]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p ios-shots

          # 1) ルビ単体のページを Safari で開いて撮る。
          #    アプリ本体はスタート画面のひと押しを経ないとホームへ進まず、
          #    simctl はタップを送れないので、ルビの乗った画面まで到達できない。
          #    見たいのは「iOS の WebKit がルビをどう組むか」なので、そこだけ
          #    取り出したページを開く（scripts/ruby-probe.html）。
          node scripts/serve-dist.mjs scripts 8099 &
          SERVER=$!
          # **応答するまで待つ**。sleep 2 では足りなかった——サーバが立つ15秒前に
          # openurl を叩いてしまい、Operation timed out（exit 60）でステップごと
          # 終わって、スクリーンショットが1枚も残らなかった。
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ruby-probe.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/ruby-probe.html             && echo "server ready" || echo "server did not come up"

          # 以降は1つ失敗しても続ける。欲しいのは合否ではなく**画像**なので、
          # 撮れるところまで撮る（前回は openurl の失敗で全部落ちた）。
          xcrun simctl openurl "$UDID" "http://127.0.0.1:8099/ruby-probe.html" || true
          sleep 10
          xcrun simctl io "$UDID" screenshot ios-shots/ruby-probe.png || true
          kill "$SERVER" 2>/dev/null || true

          # 2) アプリ本体を起動して撮る（スタート画面まで）。WKWebView が
          #    実際に立ち上がるかの確認を兼ねる。
          APP=$(find build/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          if [ -n "$APP" ]; then
            xcrun simctl install "$UDID" "$APP" || true
            xcrun simctl launch "$UDID" jp.ac.nit.kumeno.neuro || true
            sleep 8
            xcrun simctl io "$UDID" screenshot ios-shots/app-start.png || true
          fi
          ls -la ios-shots || true

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shots
          path: ios-shots/
          if-no-files-found: warn
          retention-days: 14
