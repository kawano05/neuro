<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1180, "height": 820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bg: 0, snd: 0, voice: 0 };
  }
  renderVals() {
    const groups = { bg: 2, snd: 3, voice: 2 };
    const v = {};
    Object.keys(groups).forEach((g) => {
      for (let i = 0; i < groups[g]; i++) {
        const on = this.state[g] === i;
        v[g + i + 'St'] = on ? 'background: #111111; color: #FFFFFF; border: 2px solid #111111;' : 'background: #FFFFFF; color: #111111; border: 2px solid #111111;';
        v[g + i + 'Pressed'] = on ? 'true' : 'false';
        v[g + i + 'Pick'] = () => this.setState({ [g]: i });
      }
    });
    return v;
  }
}
</script>
