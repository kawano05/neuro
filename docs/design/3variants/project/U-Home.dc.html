<script type="text/x-dc" data-dc-script data-props='{"scanMs": {"editor": "int", "default": 1600, "min": 800, "max": 3200, "step": 100, "unit": "ms", "section": "走査"}, "$preview": {"width": 1180, "height": 820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { s: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ s: (this.state.s + 1) % 6 }), this.props.scanMs ?? 1600);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const on = '0 0 0 5px #FFC83D, 0 0 0 8px #111111';
    const v = {};
    for (let i = 0; i < 6; i++) v['ring' + i] = i === this.state.s ? on : 'none';
    return v;
  }
}
</script>
