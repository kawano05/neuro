class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { s: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ s: (this.state.s + 1) % 6 }), this.props.scanMs ?? 1600);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const on = '0 0 0 5px #FFC83D, 0 0 0 8px #1A1A1A';
    const v = {};

  }
}
